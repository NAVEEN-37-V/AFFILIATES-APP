<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: #1a2340;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-wrapper {
      width: 1040px;
      max-width: 98vw;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }

    /* ── Illustrated background ── */
    .bg {
      position: absolute;
      inset: 0;
      background:
        /* sky gradient */
        linear-gradient(180deg,
          #0d1b3e 0%,
          #1c2d5c 18%,
          #3a3060 32%,
          #7a3a5a 48%,
          #c05a3a 62%,
          #e07840 72%,
          #c86030 80%,
          #2a4060 90%,
          #1a3050 100%
        );
    }

    /* Stars */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 8%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 12%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 5%, rgba(255,255,255,.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 10%, rgba(255,255,255,.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 7%, rgba(255,255,255,.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 14%, rgba(255,255,255,.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 4%, rgba(255,255,255,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 18%, rgba(255,255,255,.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 2%, rgba(255,255,255,.7) 0%, transparent 100%);
    }

    /* Mountains */
    .mountains {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 72%;
    }
    .mountain {
      position: absolute;
      bottom: 0;
    }
    .mountain svg { display: block; }

    /* Lake / water reflection */
    .lake {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 22%;
      background: linear-gradient(180deg,
        rgba(40,70,110,.55) 0%,
        rgba(30,55,90,.7) 50%,
        rgba(20,40,70,.85) 100%
      );
    }

    /* ── Nav bar ── */
    .navbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 18px 32px;
      gap: 0;
    }
    .logo {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.6);
      display: flex; align-items: center; justify-content: center;
      margin-right: 36px;
      color: #fff;
      font-size: 20px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(6px);
    }
    .nav-links {
      display: flex;
      gap: 48px;
      list-style: none;
      flex: 1;
      justify-content: center;
    }
    .nav-links a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: .3px;
      transition: color .2s;
    }
    .nav-links a:hover { color: #fff; }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid rgba(255,255,255,.5);
      border-radius: 22px;
      padding: 6px 18px;
      color: #fff;
      font-size: 13px;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      transition: background .2s;
    }
    .search-btn:hover { background: rgba(255,255,255,.1); }
    .avatar-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1.5px solid rgba(255,255,255,.35);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px; cursor: pointer;
    }

    /* ── Main content area ── */
    .main {
      position: relative;
      z-index: 10;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
    }

    /* ── Glassmorphism card ── */
    .card {
      background: rgba(60, 90, 130, 0.35);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1.5px solid rgba(255,255,255,.22);
      border-radius: 18px;
      padding: 40px 44px 36px;
      width: 340px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.18);
    }

    .card h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      letter-spacing: .3px;
    }
    .card .sub {
      font-size: 13px;
      color: rgba(255,255,255,.7);
      margin-bottom: 28px;
    }
    .card .sub a {
      color: #5b9bd5;
      text-decoration: none;
      font-weight: 500;
    }
    .card .sub a:hover { text-decoration: underline; }

    /* Input fields */
    .field {
      position: relative;
      margin-bottom: 22px;
      text-align: left;
    }
    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(255,255,255,.45);
      padding: 8px 0 6px;
      font-size: 14px;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    .field input::placeholder { color: rgba(255,255,255,.6); }
    .field input:focus { border-bottom-color: #5b9bd5; }

    /* Sign Up button */
    .btn-signup {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #4a86d8 0%, #5a9ce8 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: .4px;
      margin-top: 4px;
      box-shadow: 0 4px 16px rgba(74,134,216,.45);
      transition: opacity .2s, transform .15s;
    }
    .btn-signup:hover { opacity: .92; transform: translateY(-1px); }
    .btn-signup:active { transform: translateY(0); }

    /* Social divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0 18px;
      color: rgba(255,255,255,.55);
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.3);
    }

    /* Social icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .social-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform .2s;
      border: none;
      font-size: 20px;
    }
    .social-icon:hover { transform: scale(1.08); }
    .social-fb { background: #1877f2; color: #fff; font-weight: 700; font-size: 18px; font-family: serif; }
    .social-g  { background: #fff; }
    .social-g svg { width: 22px; height: 22px; }

    /* ── Illustrated trees ── */
    .trees-left, .trees-right {
      position: absolute;
      bottom: 0;
      z-index: 5;
      pointer-events: none;
    }
    .trees-left { left: 0; }
    .trees-right { right: 0; }
  </style>
</head>
<body>
<div class="page-wrapper">

  <!-- Sky background -->
  <div class="bg"></div>

  <!-- Mountains -->
  <div class="mountains">
    <!-- Far mountains (dark blue-purple) -->
    <svg style="position:absolute;bottom:0;left:0;width:100%;height:100%;" viewBox="0 0 1040 480" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
      <!-- Back mountains -->
      <polygon points="0,480 0,260 120,130 260,230 380,100 520,200 640,90 780,210 900,140 1040,230 1040,480" fill="#2a2e5a" opacity=".9"/>
      <!-- Mid mountains -->
      <polygon points="0,480 0,310 80,200 180,280 300,160 440,250 560,140 680,240 800,170 940,260 1040,210 1040,480" fill="#35294e" opacity=".85"/>
      <!-- Snow caps -->
      <polygon points="115,138 120,130 125,138" fill="rgba(255,255,255,.7)"/>
      <polygon points="375,108 380,100 385,108" fill="rgba(255,255,255,.7)"/>
      <polygon points="635,98 640,90 645,98" fill="rgba(255,255,255,.7)"/>
      <polygon points="895,148 900,140 905,148" fill="rgba(255,255,255,.7)"/>
      <!-- Clouds -->
      <ellipse cx="200" cy="150" rx="55" ry="14" fill="rgba(220,230,255,.55)"/>
      <ellipse cx="820" cy="170" rx="60" ry="13" fill="rgba(220,230,255,.45)"/>
      <ellipse cx="530" cy="130" rx="40" ry="10" fill="rgba(220,230,255,.35)"/>
    </svg>
  </div>

  <!-- Trees left -->
  <div class="trees-left" style="width:240px;height:320px;">
    <svg viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
      <!-- Pine trees -->
      <polygon points="30,320 50,200 70,320" fill="#c06020"/>
      <polygon points="50,220 30,220 50,160 70,220" fill="#d87030"/>
      <polygon points="50,175 32,175 50,130 68,175" fill="#e08040"/>
      <!-- Second pine -->
      <polygon points="80,320 105,190 130,320" fill="#b05018"/>
      <polygon points="105,215 82,215 105,148 128,215" fill="#c86028"/>
      <polygon points="105,168 84,168 105,118 126,168" fill="#d87838"/>
      <!-- Round autumn tree -->
      <rect x="148" y="260" width="14" height="60" fill="#5a3520"/>
      <ellipse cx="155" cy="240" rx="38" ry="42" fill="#c04818"/>
      <ellipse cx="140" cy="255" rx="28" ry="30" fill="#a03810"/>
      <!-- Small pine far left -->
      <polygon points="0,320 12,260 24,320" fill="#8b3515"/>
      <polygon points="12,270 0,270 12,240 24,270" fill="#a04020"/>
    </svg>
  </div>

  <!-- Trees right -->
  <div class="trees-right" style="width:240px;height:320px;">
    <svg viewBox="0 0 240 320" xmlns="http://www.w3.org/2000/svg">
      <!-- Pine trees (mirrored) -->
      <polygon points="170,320 190,200 210,320" fill="#c06020"/>
      <polygon points="190,220 170,220 190,160 210,220" fill="#d87030"/>
      <polygon points="190,175 172,175 190,130 208,175" fill="#e08040"/>
      <!-- Second pine -->
      <polygon points="110,320 135,190 160,320" fill="#b05018"/>
      <polygon points="135,215 112,215 135,148 158,215" fill="#c86028"/>
      <polygon points="135,168 114,168 135,118 156,168" fill="#d87838"/>
      <!-- Round autumn tree -->
      <rect x="78" y="260" width="14" height="60" fill="#5a3520"/>
      <ellipse cx="85" cy="240" rx="38" ry="42" fill="#c04818"/>
      <ellipse cx="100" cy="255" rx="28" ry="30" fill="#a03810"/>
      <!-- Small pine far right -->
      <polygon points="216,320 228,260 240,320" fill="#8b3515"/>
      <polygon points="228,270 216,270 228,240 240,270" fill="#a04020"/>
    </svg>
  </div>

  <!-- Lake -->
  <div class="lake"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="9" stroke="white" stroke-width="2"/>
        <path d="M11 6 Q14 11 11 16 Q8 11 11 6Z" fill="white"/>
      </svg>
    </div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Service</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <div class="nav-right">
      <button class="search-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </button>
      <div class="avatar-icon">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
  </nav>

  <!-- Main: Sign Up Card -->
  <div class="main">
    <div class="card">
      <h1>Sign Up</h1>
      <p class="sub">Already a member? <a href="#">Log in</a></p>

      <div class="field">
        <input type="email" placeholder="Email"/>
      </div>
      <div class="field">
        <input type="password" placeholder="Password"/>
      </div>

      <button class="btn-signup">Sign Up</button>

      <div class="divider">or sign up with</div>

      <div class="socials">
        <!-- Facebook -->
        <button class="social-icon social-fb">f</button>
        <!-- Google -->
        <button class="social-icon social-g">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.16 2.85l6.09-6.09C34.38 3.06 29.44 1 24 1 14.82 1 7.03 6.48 3.44 14.22l7.09 5.51C12.3 13.56 17.67 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.61-.14-3.17-.4-4.68H24v9.35h12.65c-.55 2.94-2.2 5.43-4.67 7.1l7.22 5.61C43.47 37.68 46.5 31.53 46.5 24.5z"/>
            <path fill="#FBBC05" d="M10.53 28.27A14.6 14.6 0 0 1 9.5 24c0-1.49.26-2.93.72-4.27L3.13 14.22A23.46 23.46 0 0 0 .5 24c0 3.78.9 7.36 2.49 10.55l7.54-6.28z"/>
            <path fill="#34A853" d="M24 47c6.48 0 11.93-2.15 15.9-5.84l-7.22-5.61c-2.2 1.49-5.02 2.37-8.68 2.37-6.33 0-11.7-4.06-13.47-9.65l-7.54 6.28C7.03 41.52 14.82 47 24 47z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

</div>
</body>
</html>
